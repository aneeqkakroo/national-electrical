<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=JetBrains+Mono:wght@600&amp;display=block');
      .disp{font-family:Archivo,'Arial Narrow',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,monospace}
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F3566"/><stop offset="1" stop-color="#071C38"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1A2E"/><stop offset="1" stop-color="#050E1A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F1F5FA"/><stop offset="1" stop-color="#DCE4EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A5F8E"/><stop offset=".55" stop-color="#1B3253"/><stop offset="1" stop-color="#10223B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1561D6" stop-opacity=".35"/><stop offset="1" stop-color="#1561D6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <clipPath id="vanClip">
      <path id="vanShape" d="M270,690 Q256,690 256,676 L256,328 Q256,298 286,298 L930,298 Q956,298 972,316 L1098,428 Q1110,439 1126,441 L1268,460 Q1328,468 1338,522 L1346,640 Q1348,690 1304,690 Z"/>
    </clipPath>
    <symbol id="mark" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="12" fill="#0A2A52"/>
      <path d="M19 47V17M45 47V17" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M19 17L29 31L35 31L45 47" stroke="#F2B321" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="19" cy="47" r="4.5" fill="#F2B321"/><circle cx="45" cy="17" r="4.5" fill="#F2B321"/>
    </symbol>
    <g id="wheel">
      <circle r="76" fill="#0B0F15"/>
      <circle r="70" fill="none" stroke="#1C2531" stroke-width="6"/>
      <circle r="46" fill="#C9D3DF"/>
      <circle r="46" fill="none" stroke="#9AA8B8" stroke-width="3"/>
      <g fill="#8C9AAC">
        <circle cx="0" cy="-28" r="7"/><circle cx="26.6" cy="-8.7" r="7"/><circle cx="16.5" cy="22.7" r="7"/><circle cx="-16.5" cy="22.7" r="7"/><circle cx="-26.6" cy="-8.7" r="7"/>
      </g>
      <circle r="13" fill="#5E6B7C"/>
    </g>
  </defs>

  <!-- scene -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="470" rx="760" ry="330" fill="url(#glow)"/>
  <text x="800" y="118" text-anchor="middle" class="mono" font-weight="600" font-size="22" letter-spacing="6" fill="#F2B321">INSTALLATION · DESIGN · TESTING</text>
  <text x="800" y="172" text-anchor="middle" class="disp" font-weight="700" font-size="40" font-stretch="88%" fill="#EAF1FB">Cambridgeshire, the East of England &amp; Greater London</text>
  <rect y="770" width="1600" height="130" fill="url(#road)"/>
  <rect y="768" width="1600" height="4" fill="#1E3A5F"/>
  <g fill="#F2B321" opacity=".55"><rect x="60" y="835" width="120" height="8" rx="4"/><rect x="300" y="835" width="120" height="8" rx="4"/><rect x="540" y="835" width="120" height="8" rx="4"/><rect x="780" y="835" width="120" height="8" rx="4"/><rect x="1020" y="835" width="120" height="8" rx="4"/><rect x="1260" y="835" width="120" height="8" rx="4"/><rect x="1500" y="835" width="120" height="8" rx="4"/></g>
  <ellipse cx="800" cy="776" rx="610" ry="22" fill="#000000" opacity=".45"/>

  <!-- van body -->
  <use href="#vanShape" fill="url(#body)"/>
  <g clip-path="url(#vanClip)">
    <!-- livery -->
    <rect x="240" y="560" width="1120" height="140" fill="#0A2A52"/>
    <rect x="240" y="550" width="1120" height="10" fill="#F2B321"/>
    <path d="M1180 298 L1360 298 L1360 560 L1020 560 Z" fill="#0A2A52" opacity="0"/>
    <!-- roof highlight -->
    <rect x="240" y="298" width="1120" height="6" fill="#FFFFFF"/>
  </g>
  <use href="#vanShape" fill="none" stroke="#B9C6D6" stroke-width="2"/>

  <!-- windows -->
  <path d="M962,326 Q962,318 970,322 L1080,420 Q1086,428 1076,428 L970,428 Q962,428 962,420 Z" fill="url(#glass)"/>
  <path d="M988,330 L1006,346 L978,410 L970,410 Z" fill="#FFFFFF" opacity=".12"/>
  <!-- panel lines -->
  <g fill="none" stroke="#B9C6D6" stroke-width="2">
    <path d="M948,306 L948,548"/>
    <path d="M948,560 L948,688" stroke="#1E3F6E"/>
  </g>
  <rect x="902" y="470" width="30" height="8" rx="4" fill="#9AA8B8"/>
  <rect x="980" y="470" width="30" height="8" rx="4" fill="#9AA8B8"/>
  <!-- mirror, lights, bumper -->
  <path d="M1086,432 L1112,432 Q1120,432 1120,440 L1120,462 Q1120,470 1112,470 L1094,470 Z" fill="#0A2A52"/>
  <path d="M1292,486 Q1330,490 1336,528 L1300,528 Q1286,528 1284,514 Z" fill="#E8F1FF" stroke="#9AA8B8" stroke-width="2"/>
  <rect x="1296" y="500" width="22" height="6" rx="3" fill="#F2B321"/>
  <rect x="250" y="340" width="12" height="90" rx="4" fill="#C62828"/>
  <rect x="250" y="436" width="12" height="26" rx="4" fill="#F2B321"/>
  <path d="M1250,690 L1350,690 Q1352,672 1346,660 L1250,660 Z" fill="#0B1626"/>
  <rect x="248" y="664" width="40" height="26" rx="4" fill="#0B1626"/>

  <!-- logo + text on side -->
  <use href="#mark" x="296" y="338" width="122" height="122"/>
  <text x="440" y="414" class="disp" font-weight="850" font-size="80" font-stretch="84%" fill="#0A2A52" letter-spacing="1">NATIONAL</text>
  <text x="442" y="455" class="disp" font-weight="650" font-size="29" fill="#1561D6" letter-spacing="9.6">ELECTRICAL LTD</text>
  <text x="298" y="514" class="disp" font-weight="600" font-size="27" font-stretch="92%" fill="#53647A">Rewires · Consumer units · EICR · EV chargers</text>
  <text x="805" y="638" text-anchor="middle" class="disp" font-weight="800" font-size="50" font-stretch="88%" fill="#FFFFFF" letter-spacing="1">07344 988182</text>
  <text x="805" y="674" text-anchor="middle" class="mono" font-weight="600" font-size="22" fill="#F2B321" letter-spacing="1">nationalelectrical.uk</text>

  <!-- wheel arches + wheels -->
  <circle cx="478" cy="700" r="92" fill="#06101D"/>
  <circle cx="1132" cy="700" r="92" fill="#06101D"/>
  <use href="#wheel" x="478" y="700"/>
  <use href="#wheel" x="1132" y="700"/>
</svg>
